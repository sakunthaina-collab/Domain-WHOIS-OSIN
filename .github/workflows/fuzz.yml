name: Nightly Property-Based Fuzzing

on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC daily
  workflow_dispatch:

jobs:
  hypothesis-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements-dev.txt || pip install hypothesis pytest pyyaml
      - name: Run Hypothesis Fuzzing (1,000 examples per property)
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          pytest agent/tests/properties -v --hypothesis-show-statistics
