name: alphafold-database-fetch-and-analyze
version: 1.0.0
category: lifesci
status: runnable
description: Retrieve and analyze AlphaFold predicted structures for a protein. Use
  when the user provides a specific UniProt Accession ID and wants structural confidence
  metrics (pLDDT), domain boundary analysis, or disorder assessment. Do not use if
  the user only has a protein name, gene name, or amino acid sequence — ask for a
  UniProt ID first.
triggers:
- alphafold-database-fetch-and-analyze
- alphafold
- database
- fetch
- and
- analyze
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for alphafold-database-fetch-and-analyze
  required:
  - instruction
runtime:
  type: python
  entry: run.py
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\science\skills\alphafold_database_fetch_and_analyze\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
