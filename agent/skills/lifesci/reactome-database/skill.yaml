name: reactome-database
version: 1.0.0
category: lifesci
status: runnable
description: Query the Reactome database (Analysis and Content Services). Use when
  the user asks about pathway analysis, gene list enrichment, retrieving results by
  token, finding unmapped or not-found identifiers, mapping identifiers, reaction
  participants (inputs, outputs), pathway hierarchy (including top-level pathways),
  diagram export, cross-reference mapping, or searching the knowledgebase.
triggers:
- reactome-database
- reactome
- database
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for reactome-database
  required:
  - instruction
runtime:
  type: python
  entry: run.py
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\science\skills\reactome_database\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
