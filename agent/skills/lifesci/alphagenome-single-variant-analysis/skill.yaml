name: alphagenome-single-variant-analysis
version: 1.0.0
category: lifesci
status: runnable
description: Analyzes genetic variant effects on gene expression (RNA-seq), chromatin
  accessibility (DNASE), histone marks (ChIP), and transcription factors using the
  AlphaGenome API. Use when the user asks about non-coding variant effects, pathogenicity,
  clinical significance, disease associations, functional effects, gene expression
  changes, splicing disruption, or regulatory effects in promoters and enhancers.
  Also use for resolving biological terms to tissue/cell-type ontologies (UBERON/CL)
  or analyzing variants in chr:pos:ref>alt format.
triggers:
- alphagenome-single-variant-analysis
- alphagenome
- single
- variant
- analysis
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for alphagenome-single-variant-analysis
  required:
  - instruction
runtime:
  type: python
  entry: run.py
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\science\skills\alphagenome_single_variant_analysis\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
