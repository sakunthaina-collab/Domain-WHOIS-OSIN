name: alphagenome-atlas-website-links
version: 1.0.0
category: lifesci
status: runnable
description: Constructs deep-links and URLs for the AlphaGenome Atlas website. Supports
  generating single-variant exploration links (1-based VCF-style coordinates), genomic
  locus views (1-based closed chr:start-end), candidate summary tables, and AlphaGenome
  reference vs. alternate predictions. Use when visualizing, exploring, charting,
  or linking genetic variants and genomic loci on the AlphaGenome Atlas, or when asked
  to inspect, view, or link predictions for a genomic variant. Don't use for computing
  raw AlphaGenome variant predictions directly without Atlas URLs (use alphagenome-single-variant-analysis
  or alphagenome-variant-impact-score).
triggers:
- alphagenome-atlas-website-links
- alphagenome
- atlas
- website
- links
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for alphagenome-atlas-website-links
  required:
  - instruction
runtime:
  type: python
  entry: run.py
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\science\skills\alphagenome_atlas_website_links\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
