name: drawio-skill
version: 1.0.0
category: docs
status: runnable
description: Create and edit draw.io/diagrams.net diagrams as editable `.drawio` files.
  Covers architecture, UML/ERD/sequence, BPMN, network, and swimlane views authored
  from a description or converted from code, IaC, SQL, and API schemas, plus sync,
  query, test, review, export, and publish of existing diagrams. Use when the user
  asks for draw.io/diagrams.net or an editable diagram; prefer Mermaid/PlantUML when
  diagrams-as-code is enough.
triggers:
- drawio-skill
- drawio
- skill
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for drawio-skill
  required:
  - instruction
runtime:
  type: python
  entry: run.py
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\skills\drawio-skill\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
