name: gdocs
version: 1.0.0
category: docs
status: runnable
description: Read, create, edit, and manage Google Docs. Use when the user shares
  a docs.google.com URL, asks to summarize or extract content from a doc, wants a
  doc drafted, edited, formatted, or commented on, wants tables, images, or smart
  chips inserted, wants markdown imported or synchronized with a doc, or wants a doc
  exported. Requires a known document ID — to find documents, use the gdrive skill
  from the Google Drive plugin; if it isn't installed, ask the user for the doc link.
  Don't use for Google Sheets, Slides, or Drive file management.
triggers:
- gdocs
- gdocs
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for gdocs
  required:
  - instruction
runtime:
  type: python
  entry: run.py
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\gdocs\skills\gdocs\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
