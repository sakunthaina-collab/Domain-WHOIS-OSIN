name: google-cloud-filestore-auditing
version: 1.0.0
category: engineering
status: runnable
description: Audits Filestore instances on Google Cloud across projects for disaster
  recovery readiness (missing or stale backups), security access governance (overly
  permissive NFS export rules, 0.0.0.0/0 exposure, missing ROOT_SQUASH), and reliability
  compliance (Physical Zone Isolation PZI and Physical Zone Separation PZS). Use when
  assessing storage health posture, auditing NFS export permissions, identifying unprotected
  file shares, or validating zone failure domains. Don't use for Cloud Storage buckets,
  Persistent Disk, or NetApp Volumes.
triggers:
- google-cloud-filestore-auditing
- google
- cloud
- filestore
- auditing
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for google-cloud-filestore-auditing
  required:
  - instruction
runtime:
  type: python
  entry: run.py
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\antigravity\worktrees\adventurous-pasteur\install_new_skill\google-skills\skills\cloud\google-cloud-filestore-auditing\SKILL.md
permissions:
- filesystem:read
risk: low
