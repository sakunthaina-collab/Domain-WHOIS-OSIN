name: gcalendar
version: 1.0.0
category: engineering
status: runnable
description: Read, create, and manage Google Calendar events. Use when the user shares
  a calendar.google.com URL, asks what is on their schedule, wants an event found,
  created, updated, deleted, or moved, wants to RSVP, wants free/busy or scheduling
  conflicts checked before proposing a time, wants focus time or an out-of-office
  block created, wants an event quick-added from a phrase or imported from an ICS
  file, or wants to know where someone is working from and which timezone they are
  in. Don't use for Gmail, Chat, or Tasks.
triggers:
- gcalendar
- gcalendar
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for gcalendar
  required:
  - instruction
runtime:
  type: python
  entry: run.py
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\gcalendar\skills\gcalendar\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
