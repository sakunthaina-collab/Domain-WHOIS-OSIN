name: notebook-guidance
version: 1.0.0
category: engineering
status: stub
description: "This skill guides the use of Jupyter notebooks for data analysis, exploration,\
  \ and visualization, particularly with BigQuery. It outlines best practices for\
  \ notebook execution and validation (supporting both cell-by-cell execution and\
  \ full notebook generation depending on tool availability), library installation,\
  \ and structuring notebooks for clarity. It also covers specific rules for data\
  \ cleaning, plotting, and integrating with BigQuery SQL and machine learning workflows.\n\
  Relevant when any of the following conditions are true:\n  1. The user request involves\
  \ a data analysis, data exploration, data visualization, or data insights task that\
  \ requires multiple steps, queries, or visualizations to answer.\n  2. The user\
  \ explicitly requests a notebook (.ipynb).\n  3. You are creating, editing, or executing\
  \ cells in a Jupyter notebook.\n  4. You need to query BigQuery from within a notebook.\
  \ DO NOT use the Python BigQuery client library; instead, you MUST use the `%%bqsql`\
  \ magics explained in this skill."
triggers:
- notebook-guidance
- notebook
- guidance
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for notebook-guidance
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\data-agent-kit-plugin\skills\notebook-guidance\SKILL.md
permissions:
- filesystem:read
risk: low
