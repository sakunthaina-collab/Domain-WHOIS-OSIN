name: access-protected-vercel-deployment
version: 1.0.0
category: engineering
status: stub
description: Access and test Vercel deployments protected by Vercel Authentication,
  SSO, or Deployment Protection. Use when curl, agent-browser, Playwright, or another
  automated request reaches a Vercel login or protection page; when a protected preview
  or production URL returns 401 or 403; when TRUSTED_SOURCES_ENVIRONMENT_MISMATCH
  appears; or when choosing between `vercel curl` and the `x-vercel-trusted-oidc-idp-token`
  header.
triggers:
- access-protected-vercel-deployment
- access
- protected
- vercel
- deployment
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for access-protected-vercel-deployment
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\vercel-plugin\skills\access-protected-vercel-deployment\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
