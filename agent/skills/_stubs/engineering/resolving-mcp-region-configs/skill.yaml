name: resolving-mcp-region-configs
version: 1.0.0
category: engineering
status: stub
description: 'Mandatory Step 0 pre-flight check for regional Google Cloud MCP servers
  (e.g. Dataproc) before using MCP tools or falling back to gcloud/bq CLI. Use whenever
  interacting with Dataproc clusters, Spark batches, jobs, sessions, or regional GCP
  resources. Fixes regional MCP servers whose endpoint URL still has an unreplaced
  $GCP_REGION / ${REGION} placeholder across Claude Code, Codex, and Antigravity.
  Trigger: an expected mcp__*_{service}_* tool is missing entirely (not just failing),
  or a call to one fails/hangs on a malformed host. Check via ToolSearch/deferred-tools
  listing before falling back to gcloud/bq CLI. Asks the user for a region, patches
  the live MCP config file(s), and tells the user how to restart without losing session
  context.'
triggers:
- resolving-mcp-region-configs
- resolving
- mcp
- region
- configs
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for resolving-mcp-region-configs
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\data-agent-kit-plugin\skills\resolving-mcp-region-configs\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
