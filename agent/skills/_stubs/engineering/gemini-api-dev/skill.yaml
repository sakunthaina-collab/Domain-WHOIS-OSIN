name: gemini-api-dev
version: 1.0.0
category: engineering
status: stub
description: Use this skill when writing code that calls the Gemini API for text generation,
  multi-turn chat, multimodal understanding, image generation, video generation, speech
  generation (TTS), voice design, voice replication, streaming responses, background
  research tasks, function calling, structured output, or migrating from the old generateContent
