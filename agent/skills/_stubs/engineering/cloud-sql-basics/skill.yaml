name: cloud-sql-basics
version: 1.0.0
category: engineering
status: stub
description: 'This file generates or explains Cloud SQL resources. Use this file when
  the user asks to create a Cloud SQL instance or database for MySQL, PostgreSQL,
  or SQL Server.

  Cloud SQL manages third-party MySQL, PostgreSQL, and SQL Server instances as resources
  in Cloud SQL. For example, when Cloud SQL creates an open-source MySQL instance,
  the resulting resource is a Cloud SQL for MySQL instance that Google Cloud manages.

  Cloud SQL handles backups, high availability, and secure connectivity for relational
  database workloads.'
