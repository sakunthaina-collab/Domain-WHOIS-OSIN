name: cookie-debugging
version: 1.0.0
category: engineering
status: stub
description: Uses Chrome DevTools MCP for inspecting, debugging, and testing cookies,
  session state, authentication issues, and cookie consent compliance. Use when diagnosing
  401/403 errors, authentication redirects, session expiration, Cookie/Set-Cookie
  header issues, cookie banner consent conformance, or third-party cookie/SameSite/Partitioned
  cookie warnings.
triggers:
- cookie-debugging
- cookie
- debugging
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for cookie-debugging
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\chrome-devtools-plugin\skills\cookie-debugging\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
