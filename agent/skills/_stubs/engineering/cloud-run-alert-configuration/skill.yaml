description: Configures best-practice, high-signal alerting policies for Cloud Run
  resources on Google Cloud (services, jobs, and worker pools) based on seasoned SRE
  practices. Use when analyzing, recommending, writing, or deploying Terraform PromQL
  alerting policies to monitor Cloud Run error rates (4xx/5xx), request latency, container
  instance saturation (warning/critical), container CPU/memory utilization and allocation,
  billable instance time, job execution status, and worker pool queue backlog. Don't
  use for GKE workloads (use gke-alert-configuration) or Compute Engine VMs.
