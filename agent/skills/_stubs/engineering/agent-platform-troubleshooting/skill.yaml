  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\antigravity\worktrees\adventurous-pasteur\install_new_skill\google-skills\skills\cloud\agent-platform-troubleshooting\SKILL.md
