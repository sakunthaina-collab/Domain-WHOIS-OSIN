name: vercel-tracing
version: 1.0.0
category: engineering
status: stub
description: Set up OpenTelemetry instrumentation for Vercel Tracing and query the
  resulting spans. Use when adding or fixing `@vercel/otel`, wiring a framework's
  server startup hook (Next.js, SvelteKit, and others), adding custom spans, turning
  on spans from libraries such as the AI SDK, Flags SDK, or database clients, propagating
  trace context between services, configuring always-on tracing sampling, searching
  or inspecting spans with `vercel traces`, or debugging failed or slow server requests.
triggers:
- vercel-tracing
- vercel
- tracing
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for vercel-tracing
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\vercel-plugin\skills\vercel-tracing\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
