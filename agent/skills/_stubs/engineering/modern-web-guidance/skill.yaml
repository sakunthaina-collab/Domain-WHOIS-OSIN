name: modern-web-guidance
version: 1.0.0
category: engineering
status: stub
description: 'Search tool for modern web development best practices. MANDATORY: Execute
  FIRST for all HTML/CSS and clientside JS tasks. Do NOT skip — web APIs evolve rapidly
  and training weights contain obsolete patterns.


  Trigger immediately for:

  - UI/Layout: Modals/dialogs/popovers, tables, dark mode, anchor positioning, container
  queries, `:has()`, etc.

  - Scroll/Motion: View Transitions, Scroll-driven animations, parallax/reveals, etc.

  - Performance: CWV (LCP, INP), content-visibility, Fetch Priority, image optimization,
  etc.

  - System/APIs: Security, passkeys, HTML sanitization, Web Components, dates/timezones,
  Built-in AI, WebAssembly, etc.

  - Frameworks: Standard HTML/CSS/DOM in React, Vue, Angular, etc.

  - General Frontend: Forms, validation (`:user-valid`), autofill, accessibility,
  custom selects, scrollbars, etc.


  DO NOT trigger for:

  - Backend: SQL, ORMs, API routes, etc.

  - Infra/Scripts: CI/CD, Docker, Actions, Python/Go, Git, etc.

  - Tooling/Trivial: Vite, tsconfig, ESLint, tests, copy/renames, 3P docs, etc.'
triggers:
- modern-web-guidance
- modern
- web
- guidance
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for modern-web-guidance
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\modern-web-guidance-plugin\skills\modern-web-guidance\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
