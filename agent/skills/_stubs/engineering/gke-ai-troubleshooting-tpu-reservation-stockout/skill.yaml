name: gke-ai-troubleshooting-tpu-reservation-stockout
version: 1.0.0
category: engineering
status: stub
description: Diagnose and resolve cluster-wide GKE TPU node pool creation or scale-up
  failures caused by Compute Engine reservation stockouts (GCE_STOCKOUT, ZONE_RESOURCE_POOL_EXHAUSTED)
  when existing unhealthy or NotReady TPU node pools in the cluster have node auto-repair
  disabled and hold reserved TPU capacity. Use when TPU node pool creation or scale-up
  fails with GCE_STOCKOUT, ZONE_RESOURCE_POOL_EXHAUSTED, or ZONE_RESOURCE_POOL_EXHAUSTED_WITH_DETAILS
  despite having a specific Compute Engine TPU reservation. Don't use for general
  pod scheduling without a TPU reservation or workload-level container crashes.
