name: vercel-cli
version: 1.0.0
category: engineering
status: stub
description: Vercel CLI expert guidance. Use when deploying, managing environment
  variables, linking projects, viewing logs, querying metrics, debugging a deployed
  app on Vercel (errors, 5xx responses, timeouts, slow routes, or a single failing
  request), managing domains, managing feature flags with vercel flags, or interacting
  with the Vercel platform from the command line. Use the vercel-tracing skill instead
  for `vercel traces` span search, trace inspection, and sampling rules, or for OpenTelemetry
  setup.
triggers:
- vercel-cli
- vercel
- cli
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for vercel-cli
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\vercel-plugin\skills\vercel-cli\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
