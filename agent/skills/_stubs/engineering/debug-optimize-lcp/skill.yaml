name: debug-optimize-lcp
version: 1.0.0
category: engineering
status: stub
description: Guides debugging and optimizing Largest Contentful Paint (LCP) using
  Chrome DevTools MCP tools. Use this skill whenever the user asks about LCP performance,
  slow page loads, Core Web Vitals optimization, or wants to understand why their
  page's main content takes too long to appear. Also use when the user mentions "largest
  contentful paint", "page load speed", "CWV", or wants to improve how fast their
  hero image or main content renders.
triggers:
- debug-optimize-lcp
- debug
- optimize
- lcp
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for debug-optimize-lcp
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\chrome-devtools-plugin\skills\debug-optimize-lcp\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
