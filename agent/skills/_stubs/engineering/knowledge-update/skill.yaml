name: knowledge-update
version: 1.0.0
category: engineering
status: stub
description: Corrects outdated LLM knowledge about the Vercel platform and introduces
  new products. Injected at session start.
triggers:
- knowledge-update
- knowledge
- update
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for knowledge-update
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\vercel-plugin\skills\knowledge-update\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
