name: gcp-dataflow
version: 1.0.0
category: engineering
status: stub
description: "Guides writing, packaging, executing, and troubleshooting Apache Beam\
  \ pipelines on Dataflow. Use when creating new pipelines, configuring Flex Templates,\
  \ or analyzing performance of Dataflow jobs. Capabilities include Java/Python/Go\
  \ setup, Cloud Build integration, and deep diagnostic analysis of job health and\
  \ autoscaling.\nUse when: - Creating an Apache Beam Dataflow pipeline. - Creating\
  \ a Google Dataflow Flex Template. - Using an existing Google Dataflow Template.\
  \ - Debugging Dataflow pipeline - Troubleshooting Dataflow pipeline - Analyzing\
  \ Performance of Dataflow pipeline.\nKey capabilities: Java/Python/Go project setup,\
  \ Flex Templates (with Cloud Build), and diagnostics for streaming job health, bottlenecks,\
  \ and autoscaling.\nDo NOT use for: - General GCP resource management unrelated\
  \ to Dataflow. - Issues with other GCP services (e.g., GCE, GCS, BigQuery) unless\
  \ directly\n  impacting Dataflow pipeline execution.\n- Pipeline technologies other\
  \ than Apache Beam on Dataflow."
triggers:
- gcp-dataflow
- gcp
- dataflow
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for gcp-dataflow
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\data-agent-kit-plugin\skills\gcp-dataflow\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
