name: firebase-security-rules-auditor
version: 1.0.0
category: engineering
status: stub
description: Audits Firebase (Firestore, Cloud Storage) security rules for vulnerabilities,
  privilege escalation, role bypasses, create vs update inconsistencies, resource
  exhaustion, type safety, size limits, and hasOnly ownership checks. Use when auditing/reviewing
  rules, running red-team rule assessments, or scoring against auditor checklists.
  Don't use for Firebase CLI (login, deploy), Auth, Crashlytics, Remote Config, or
  database queries.
triggers:
- firebase-security-rules-auditor
- firebase
- security
- rules
- auditor
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for firebase-security-rules-auditor
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\firebase\skills\firebase_security_rules_auditor\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
