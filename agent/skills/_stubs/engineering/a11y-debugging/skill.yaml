name: a11y-debugging
version: 1.0.0
category: engineering
status: stub
description: Uses Chrome DevTools MCP for accessibility (a11y) debugging and auditing
  based on web.dev guidelines. Use when testing semantic HTML, ARIA labels, focus
  states, keyboard navigation, tap targets, and color contrast.
triggers:
- a11y-debugging
- a11y
- debugging
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for a11y-debugging
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\chrome-devtools-plugin\skills\a11y-debugging\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
