name: gke-storage-troubleshooting
version: 1.0.0
category: engineering
status: stub
description: Diagnoses GKE persistent-storage failures — volume attach/mount errors
  (Regional PD on optimized VMs, fsGroup mount timeouts), disk-performance and node
  storage-pressure issues, slow-disk Pod-creation failures, volume-expansion problems,
  Local SSD / Hyperdisk Storage Pool creation errors, and Cloud Storage FUSE OOM.
  Use when Pods are stuck in ContainerCreating, volumes fail to attach or mount, or
  nodes report storage pressure. Don't use for routine storage provisioning or StorageClass/PVC
  authoring (see the gke-storage skill).
triggers:
- gke-storage-troubleshooting
- gke
- storage
- troubleshooting
