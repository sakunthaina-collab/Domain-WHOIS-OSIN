name: firebase-hosting-basics
version: 1.0.0
category: engineering
status: stub
description: Deploys and configures classic Firebase Hosting for static websites,
  single-page apps (SPAs), and microservices. Use when deploying static sites/SPAs,
  setting up custom domains, configuring firebase.json hosting settings (redirects,
  rewrites, headers, multi-site), or managing preview channels. Don't use for Firebase
  App Hosting (Next.js/SSR), Auth, Firestore queries/rules, Data Connect, or Crashlytics.
