name: finding-google-skills
version: 1.0.0
category: engineering
status: stub
description: Google platform decision and setup guidance, loaded on demand from Google's
  skill catalog. Use when a developer is choosing or setting up part of their stack,
  such as where to run a service, a database, storage, messaging, authentication,
  analytics, ads, or AI model serving, and a Google product is a reasonable candidate
  - whether or not a vendor is named - or when a request names a Google product or
  API. Brings in the matching Google skill so the answer can weigh Google options,
  their trade-offs, and when they are not the right fit. Skip when the stack is already
  settled on another provider and no Google product is named, or the task involves
  no platform choice.
triggers:
- finding-google-skills
- finding
- google
- skills
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for finding-google-skills
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\google-cloud-developer\skills\finding-google-skills\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
