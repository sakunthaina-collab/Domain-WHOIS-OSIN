name: google-cloud-storage-bucket-architect
version: 1.0.0
category: engineering
status: stub
description: Creates Cloud Storage (Google Cloud Storage, or GCS) buckets. Analyzes
  the workload (sensitive data, media hosting, ingestion, web hosting, archiving,
  backup, logging, analytics, AI/ML, or general-purpose), validates project-level
  security settings, and designs a secure-by-default, cost-effective configuration
  (location, storage class, uniform bucket-level access, public access prevention,
  soft delete, lifecycle) before creating it. Use whenever a user wants to create,
  make, set up, provision, or spin up a bucket, or needs object storage for an app,
  service, pipeline, or dataset — even a "simple" or "default" bucket, or when bucket
  creation is one step in a larger workflow. Outputs or executes the creation via
  gcloud, the JSON/REST API, Terraform, or SDK client libraries (C++, Java, Python,
  Go). Don't use for anything other than creating new buckets — for uploads, downloads,
  access changes, or reconfiguring existing buckets, use google-cloud-storage-basics.
triggers:
- google-cloud-storage-bucket-architect
- google
- cloud
- storage
- bucket
- architect
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for google-cloud-storage-bucket-architect
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\data-agent-kit-plugin\skills\google-cloud-storage-bucket-architect\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
