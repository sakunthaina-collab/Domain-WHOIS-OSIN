name: netlify-identity
version: 1.0.0
category: engineering
status: stub
description: Add user authentication to a Netlify site with @netlify/identity — signup/login/logout,
  Google/GitHub/GitLab/Bitbucket OAuth, server-side getUser() checks, role-based access
  control, and Identity event functions. Use it when a task involves adding a login
  or signup form, gating content to members or roles, "auth middleware" or verifying
  users in Netlify Functions or Edge Functions, handling OAuth or email-confirmation
  callbacks, assigning roles at signup, or customizing Identity emails. For locking
  a whole site to your company or employees-only access, use netlify-access-control
  instead.
triggers:
- netlify-identity
- netlify
- identity
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for netlify-identity
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\netlify\agent-plugin\skills\netlify-identity\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
