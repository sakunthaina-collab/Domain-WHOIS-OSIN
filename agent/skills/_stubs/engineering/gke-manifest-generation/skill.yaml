description: Generates and updates secure, production-ready Kubernetes YAML manifests
  optimized for GKE Autopilot and GKE Standard clusters. Use when creating or modifying
  GKE deployment manifests, configuring container security contexts, setting CPU/memory
  resource limits, defining readiness/liveness/startup probes, mounting secrets and
  volumes, configuring GKE Gateway API routes, targeting Spot VMs, or deploying AI
  model inference workloads (vLLM, TGI, Gemma). Don't use for live cluster operations,
  pod troubleshooting (use gke-workload-troubleshooting), or cluster infrastructure
  provisioning (use gke-cluster-creation).
