description: Manages Google Analytics reporting data, enables the Analytics Data API
  via the Cloud CLI, and creates reports using the Google Analytics Data API (v1beta).
  Use when you need to interact with Google Analytics properties, run customized analytics
  reports, query metrics (like activeUsers, screenPageViews) and dimensions (like
