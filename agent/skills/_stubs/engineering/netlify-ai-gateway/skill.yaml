name: netlify-ai-gateway
version: 1.0.0
category: engineering
status: stub
description: Use Netlify AI Gateway to call OpenAI, Anthropic Claude, Google Gemini,
  TypeSafe (Jev), or OpenRouter-hosted models (xAI/DeepSeek/Meta/Mistral/Qwen) from
  Netlify Functions or Edge Functions without managing provider accounts or API keys.
  Reach for this when adding an AI feature to a Netlify app — a chatbot, text summarizer,
  image generator, joke/content generator, form-submission routing or analysis, or
  any LLM call — or when wiring the OpenAI/Anthropic/Gemini/TypeSafe/OpenRouter SDK
  into a Netlify Function, choosing which env vars to use, streaming long generations,
  or debugging why gateway calls fail at build time or return 401.
triggers:
- netlify-ai-gateway
- netlify
- gateway
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for netlify-ai-gateway
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\netlify\agent-plugin\skills\netlify-ai-gateway\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
