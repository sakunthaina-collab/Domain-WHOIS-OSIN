name: retrieving-developer-knowledge
version: 1.0.0
category: engineering
status: stub
description: Searches, retrieves, and synthesizes official Google developer documentation
  across Google Cloud, AI/Gemini, Android, Chrome, Web, Flutter, Go, Firebase, and
  other Google developer platforms. Integrates with the Developer Knowledge MCP server
  (search_documents, get_documents, answer_query) or the Developer Knowledge REST
  API fallback. Use when searching for gcloud CLI commands, API syntax, IAM permissions,
  official documentation, architectural comparisons, or product choice overviews.
  Don't use for local filesystem lookups or non-Google documentation.
triggers:
- retrieving-developer-knowledge
- retrieving
- developer
- knowledge
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for retrieving-developer-knowledge
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\google-cloud-developer\skills\retrieving-developer-knowledge\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
