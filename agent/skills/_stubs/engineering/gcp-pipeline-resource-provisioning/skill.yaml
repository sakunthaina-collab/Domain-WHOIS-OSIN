name: gcp-pipeline-resource-provisioning
version: 1.0.0
category: engineering
status: stub
description: 'Automates declarative resource creation and provisioning for data pipelines,
  supporting BigQuery, Dataform, Dataproc, BigQuery Data Transfer Service (DTS), and
  other resources. It manages environment-specific configurations (dev, staging, prod)
  through a deployment.yaml file.

  Use when:

  - Modifying or creating deployment.yaml for deployment settings.

  - Resolving environment-specific variables (e.g., Project IDs, Regions) for deployment.

  - Provisioning supported infrastructure like BigQuery datasets/tables, Dataform
  resources, or DTS resources via deployment.yaml.

  Do not use when:

  - Resources already exist.

  - Managing resources not supported by `gcloud beta orchestration-pipelines resource-types
  list`.

  - Managing general cloud infrastructure (VMs, networks, Kubernetes, IAM policies),
  which are better suited for Terraform.

  - Infrastructure spans multiple cloud providers (AWS, Azure, etc.).

  - Already uses Terraform for the target resources.'
triggers:
- gcp-pipeline-resource-provisioning
- gcp
- pipeline
- resource
- provisioning
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for gcp-pipeline-resource-provisioning
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\data-agent-kit-plugin\skills\gcp-pipeline-resource-provisioning\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
