name: canva-bulk-create
version: 1.0.0
category: docs
status: stub
description: Bulk-create Canva designs from tabular data using a brand template with
  autofill fields, producing one design per row. Use when users say "bulk create designs
  from this CSV", "generate one design per row", "create a design for each product",
  "batch generate from a template", or "autofill a template from a spreadsheet". Accepts
  any tabular data source — uploaded files, pasted tables, JSON, or URLs.
triggers:
- canva-bulk-create
- canva
- bulk
- create
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for canva-bulk-create
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\canva\skills\bulk-create\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
