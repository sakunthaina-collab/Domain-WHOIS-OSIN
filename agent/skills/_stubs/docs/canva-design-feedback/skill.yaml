name: canva-design-feedback
version: 1.0.0
category: docs
status: stub
description: Read a Canva design and return structured, actionable design feedback
  — visual hierarchy, copy/messaging, layout & spacing, consistency, readability,
  and accessibility. Read-only; makes no changes to the design. Use when the user
  asks to "review my design", "give me feedback on this", "critique my deck/poster/flyer",
  "how can I improve this design", or "what's wrong with this slide".
triggers:
- canva-design-feedback
- canva
- design
- feedback
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for canva-design-feedback
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\canva\skills\get-design-feedback\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
