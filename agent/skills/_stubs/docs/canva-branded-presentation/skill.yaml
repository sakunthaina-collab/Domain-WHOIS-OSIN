name: canva-branded-presentation
version: 1.0.0
category: docs
status: stub
description: Create on-brand Canva presentations from an outline or brief. Use when
  the user asks to create a branded presentation, make an on-brand deck, turn an outline
  into slides, or generate a presentation from a brief. Input can be text directly
  in the message, a Canva design ID, a reference to a Canva doc by name, or a Canva
  design link (e.g., https://www.canva.com/design/...).
triggers:
- canva-branded-presentation
- canva
- branded
- presentation
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for canva-branded-presentation
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\canva\inactive-skills\branded-presentation\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
