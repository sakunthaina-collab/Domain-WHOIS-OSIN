name: bigquery-graph-author
version: 1.0.0
category: lifesci
status: stub
description: 'Provides an end-to-end journey for authoring a BigQuery property graph
  from your tables or from a model document/diagram (an ER diagram, an ontology, a
  semantic model): dataset discovery, candidate relationships verified against the
  data, a readable plan, and `CREATE PROPERTY GRAPH` DDL with schema best practices
  and semantic measures/dimensions, plus an opt-in verification suite for the landed
  graph. Use when creating or replacing a property graph, authoring a graph from a
  dataset or a document, or verifying relationships or suspicious edge counts. Don''t
  use for querying an existing graph, for non-BigQuery graph databases, or for drawing/rendering
  diagrams.'
triggers:
- bigquery-graph-author
- bigquery
- graph
- author
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for bigquery-graph-author
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\data-agent-kit-plugin\skills\bigquery-graph-author\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
