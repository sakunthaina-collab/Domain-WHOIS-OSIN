name: supabase
version: 1.0.0
category: lifesci
status: stub
description: 'Use when doing ANY task involving Supabase. Triggers: Supabase products
  (Database, Auth, Edge Functions, Realtime, Storage, Vectors, Cron, Queues); client
  libraries and SSR integrations (supabase-js, @supabase/ssr) in Next.js, React, SvelteKit,
  Astro, Remix; auth issues (login, logout, sessions, JWT, cookies, getSession, getUser,
  getClaims, RLS); Supabase CLI or MCP server; schema changes, migrations, declarative
  schemas, security audits, Postgres extensions (pg_graphql, pg_cron, pg_vector);
  debugging and troubleshooting errors or unexpected behavior on Supabase projects
  (HTTP errors, Postgres errors, RLS surprises, permission denied, schema cache issues,
  timeouts, Edge Function crashes, Realtime drops, Storage failures) and reading or
  querying logs (Logs Explorer, ClickHouse).'
triggers:
- supabase
- supabase
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for supabase
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\supabase\skills\supabase\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
