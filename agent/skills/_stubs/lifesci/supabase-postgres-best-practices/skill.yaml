name: supabase-postgres-best-practices
version: 1.0.0
category: lifesci
status: stub
description: 'Postgres best practices maintained by Supabase, for Postgres running
  anywhere. Load this skill BEFORE writing or changing anything that lives in a Postgres
  database: creating or altering tables and columns (including choosing column types),
  schema design, migrations and declarative schema files, RLS policies and the tests
  that verify them, indexes, triggers, database functions, queues and scheduled jobs
  (pg_cron, pgmq), vector/semantic search (pgvector), and restoring dumps (pg_restore)
  or importing data. Also load it when diagnosing slow queries, high CPU, timeouts,
  EXPLAIN plans, connection exhaustion, locking, bloat, or rows visible to the wrong
  user or tenant. This is not just a performance guide — schema, migration, security,
  and SQL authoring tasks need these rules too, even for a one-column change or a
  single query.'
triggers:
- supabase-postgres-best-practices
- supabase
- postgres
- best
- practices
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for supabase-postgres-best-practices
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\supabase\skills\supabase-postgres-best-practices\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
