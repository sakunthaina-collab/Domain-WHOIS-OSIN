name: netlify-functions
version: 1.0.0
category: scraping
status: stub
description: Write, configure, and deploy Netlify serverless functions in TypeScript,
  JavaScript, or Go. Use this when adding an API endpoint or backend route, adding
  a contact form handler, wiring auth or Identity signup/login hooks, identifying
  which Netlify user is calling a private or team-login-protected app, building streaming
  or AI-proxy responses, scheduling cron jobs, running long background jobs (batch
  processing/scraping), reacting to deploy or form events, setting up rate limiting
  or region/memory config, or reading environment variables and secrets inside a function.
