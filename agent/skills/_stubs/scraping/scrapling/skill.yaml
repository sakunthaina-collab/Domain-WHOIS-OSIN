name: scrapling
version: 1.0.0
category: scraping
status: stub
description: '使用 scrapling 进行网页抓取和数据提取。根据目标网站特征自动选择最佳 Fetcher，

  生成并执行 Python 脚本完成任务。Use when:

  (1) 抓取/爬取网页内容或数据（scrape, crawl, fetch page, extract data）

  (2) 需要绕过 Cloudflare/WAF 等反爬保护

  (3) 登录后抓取受保护页面

  (4) 解析已有 HTML 提取结构化数据

  (5) 用户提供 URL 并要求获取页面内容或特定元素

  (6) 批量采集多个页面'
triggers:
- scrapling
- scrapling
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for scrapling
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\skills\scrapling\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
