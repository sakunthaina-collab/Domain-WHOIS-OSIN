name: best-practices
version: 1.0.0
category: scraping
status: stub
description: Tells your agent what Mobbin can and can't do and how the Mobbin skills
  work together, so it picks the right one or says when Mobbin isn't the right tool.
  Read it first, before any other Mobbin skill or tools, when the user asks about
  Mobbin or its connection, or starts a design task Mobbin could help with, including
  one that's too big or outside what Mobbin does.
triggers:
- best-practices
- best
- practices
input_schema:
  type: object
  properties:
    instruction:
      type: string
      description: Task instruction for best-practices
  required:
  - instruction
runtime:
  type: python
  entry: SKILL.md
  timeout: 120
  source_skill_md: C:\Users\Administrator\.gemini\config\plugins\mobbin\skills\best-practices\SKILL.md
permissions:
- filesystem:read
risk: low
outputs:
- json
